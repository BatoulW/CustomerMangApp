<h2>Dashboard</h2>
<div class="dashboard-container">
  <mat-grid-list cols="3" rowHeight="1:1" gutterSize="4px">

    @for(c of customers; track c.customerId){
    <mat-grid-tile class="dashboard-card">
      <mat-card class="mat-elevation-z4">
        <mat-card-header>
          <mat-card-title>{{ c.customerName }}</mat-card-title>
          <mat-card-subtitle>{{ c.email }}</mat-card-subtitle>
        </mat-card-header>

        <mat-card-content>
          <p><strong>Total Orders:</strong> {{ c.orders?.length || 0 }}</p>
          <p><strong>Latest Order:</strong> {{ c.orders? getLatest(c.orders) : 'No orders yet' }}</p>
        </mat-card-content>

        <mat-card-actions>
          <button mat-raised-button color="primary" (click)="viewOrders(c.customerId)">
            <mat-icon>list</mat-icon> View Orders
          </button>
        </mat-card-actions>
      </mat-card>
    </mat-grid-tile>
    }
  </mat-grid-list>

</div>
