<!--<h2>Orders for Customer {{ customerId || 'All Customers'}}</h2>-->
<mat-toolbar color="primary" class="mb-3">
  <span>Customer Orders</span>
  <span class="spacer"></span>

  <mat-slide-toggle [(ngModel)]="autoUpdateEnabled" (change)="onToggleAutoUpdate()">
    Auto-update
  </mat-slide-toggle>
</mat-toolbar>

<table mat-table [dataSource]="orders" class="mat-elevation-z8">

  <!-- Order ID -->
  <ng-container matColumnDef="orderId">
    <th mat-header-cell *matHeaderCellDef>Order ID</th>
    <td mat-cell *matCellDef="let order">{{ order.orderId }}</td>
  </ng-container>

  <!-- Description -->
  <ng-container matColumnDef="orderDesc">
    <th mat-header-cell *matHeaderCellDef>Description</th>
    <td mat-cell *matCellDef="let order">{{ order.orderDesc }}</td>
  </ng-container>

  <!-- Amount -->
  <ng-container matColumnDef="amount">
    <th mat-header-cell *matHeaderCellDef>Amount</th>
    <td mat-cell *matCellDef="let order">{{ order.amount | currency }}</td>
  </ng-container>

  <!-- Created At -->
  <ng-container matColumnDef="createdAt">
    <th mat-header-cell *matHeaderCellDef>Created At</th>
    <td mat-cell *matCellDef="let order">{{ order.createdAt | date:'short' }}</td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
</table>
